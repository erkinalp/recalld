#
# /etc/systemd/recalld/recalld.conf
# Configuration for systemd-recalld desktop capture daemon
#

[Service]
Enabled=true
LogLevel=info
StoragePath=/var/lib/systemd/recalld
MaxStorageSize=50G
RetentionDays=30
TransmissionEnabled=true
#ServerAddress=
TransmissionInterval=hourly

[AudioCapture]
Enabled=true
Sources=microphone,system
Format=opus
Quality=medium
SilenceDetection=true
BufferSize=500
SampleRate=48000
Channels=2
BitrateKbps=128
NoiseReduction=true

[VideoCapture]
Enabled=true
Codec=h264
FrameRate=15
Resolution=screen
QualityLevel=medium
KeyframeInterval=150
CaptureMethod=vnc
HardwareAcceleration=auto
MultiMonitor=true
CaptureMouseCursor=true

[Privacy]
ExcludeApplications=password-manager,banking-app
ExcludeWindows=*password*,*login*,*auth*
PrivacyMode=smart
EncryptionEnabled=true
EncryptionAlgorithm=aes-256-gcm
AllowUserOverride=true
ConsentRequired=true
DataMinimization=true

[Network]
Compression=high
EncryptionLevel=high
MaxBandwidthKbps=1000
RetryCount=5
RetryDelaySeconds=60
UseMeteredConnections=false
