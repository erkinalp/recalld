#
# /etc/systemd/recall-query-service/recall-query-service.conf
# Configuration for systemd-recall-query-service
#

[Service]
Enabled=true
LogLevel=info
StoragePath=/var/lib/systemd/recall-query-service
WorkerThreads=8
MaxConcurrentQueries=100
ShutdownTimeoutSec=30

[API]
Port=8080
RateLimitPerMinute=60
AuthenticationRequired=true
TLSEnabled=true
TLSCertPath=/etc/systemd/recall-query-service/cert.pem
TLSKeyPath=/etc/systemd/recall-query-service/key.pem
RequestTimeoutSec=30

[AIProcessing]
ModelPath=/var/lib/systemd/recall-query-service/models
GPUAcceleration=true
BatchSize=16
AudioModel=whisper-large-v3
VideoModel=clip-vit-large-patch14
ContextWindowSize=4096
MaxTokens=1024

[Storage]
DataPath=/var/lib/systemd/recall-query-service/data
IndexPath=/var/lib/systemd/recall-query-service/indexes
MaxSize=500G
RetentionDays=90
Encryption=true

[Authentication]
AuthMethod=pam
PAMServiceName=systemd-recall
# Path to file containing JWT signing secret — generate with:
#   openssl rand -base64 64 > /etc/systemd/recall-query-service/jwt-secret
JWTSecret=/etc/systemd/recall-query-service/jwt-secret
SessionTimeout=3600
FailedLoginLimit=5
FailedLoginLockoutMinutes=15

[QueryProcessing]
MaxResultsPerQuery=100
DefaultTimeRange=7d
ContextAwareness=true
ConfidenceThreshold=0.7
CacheResults=true
CacheExpirationSec=3600
